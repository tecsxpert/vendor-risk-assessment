services:

  postgres:
    image: postgres:15
    container_name: vendor_postgres
    environment:
      POSTGRES_DB: vendor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: vendor_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: vendor_backend
    depends_on:
      - postgres
      - redis
      - ai-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vendor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      AI_SERVICE_URL: http://ai-service:5000
    ports:
      - "8080:8080"

  ai-service:
    build: ./ai-service
    container_name: vendor_ai
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    container_name: vendor_frontend
    ports:
      - "3000:80"
